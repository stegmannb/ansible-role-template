---
"on":
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          path: "${{ github.repository }}"


      - name: Activate mise development environment
        uses: jdx/mise-action@v2
        with:
          experimental: true # [default: false] enable experimental features

      - name: Activate uv development environment
        run: uv sync --all-extras --dev

      - name: Run pre-commit
        run: pre-commit run --all-files
        working-directory: "${{ github.repository }}"

  molecule:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - alpine
          # - archlinux-systemd
          - archlinux
          # - debian-systemd-bookworm
          # - debian-systemd-bullseye
          - debian-bookworm
          - debian-bullseye
          # - ubuntu-systemd-noble
          # - ubuntu-systemd-jammy
          # - ubuntu-systemd-focal
          - ubuntu-noble
          - ubuntu-jammy
          - ubuntu-focal
    steps:
      - name: Cancel an already running workflow.
        uses: fkirc/skip-duplicate-actions@master

      - name: Checkout
        uses: actions/checkout@v3

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Activate mise development environment
        uses: jdx/mise-action@v2
        with:
          experimental: true # [default: false] enable experimental features

      - name: Activate uv development environment
        run: uv sync --all-extras --dev

      - name: Molecule Version
        run: molecule --version

      - name: Molecule test
        run: molecule test --scenario-name ${{ matrix.scenario }}

